.btn.w{width:100%}label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}

.menu{position:fixed;top:58px;right:12px;z-index:9;background:var(--c2);border:1px solid var(--ln);border-radius:14px;min-width:190px;padding:6px;box-shadow:0 12px 30px #0009}

.menu button:hover{background:var(--c)}.hide{display:none!important}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:20px}}
.news h3{margin-bottom:4px}.news p{color:#c9c9d8;white-space:pre-wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30}
.nt{padding:10px 0;border-top:1px solid var(--ln)}.nt.new{border-left:3px solid var(--ac);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st{text-align:center;padding:12px;margin:0}.st b{display:block;font-size:22px}
.tag.w{background:#0f3a25;color:var(--ok)}.tag.l{background:#3a1215;color:var(--er)}

:root{--bg:#000;--c:#0a0a0a;--c2:#141414;--ln:#1f1f1f;--ac:#c8f542;--ac2:#9fcb24;--mu:#8a8a8a;--gd:#c8f542}

#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:60px;background:transparent;border:0;padding:10px 14px;backdrop-filter:none}
.lg{display:flex;flex-direction:column;line-height:1;cursor:pointer;color:#fff;flex:1}.lg i{font:italic 900 19px Inter,sans-serif;letter-spacing:-.5px}.lg small{font:700 6.5px Inter,sans-serif;letter-spacing:1.6px;margin-top:3px;color:#ddd}

.pill{display:flex;align-items:center;gap:6px;padding:9px 12px;font:800 11px Inter,sans-serif;letter-spacing:.5px}
main{max-width:640px;padding:62px 20px 40px}

.tr.f{background:#0e1405;border-color:#b9e23a88}.r0{color:var(--ac);font-weight:800}.r1{color:#aaa}.r2{color:#d58a3a}.r3{color:#777}

.tav{width:22px;height:22px;border-radius:6px;border:1px solid #333;background:#161616;display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex:none}

.mc{border:1px solid #1c1c1c;background:linear-gradient(#0c0c0c,#080808);border-radius:14px;padding:12px 14px;margin-bottom:12px}.mc.dn{border-color:#2d3a12;background:linear-gradient(#0e1405,#080a04)}
.ix{color:#666;font-size:11px}.dt{color:var(--ac);font-weight:700;font-size:15px;margin-top:2px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);vertical-align:middle}.dl{color:#777;font-size:11px;margin-bottom:8px}

.g{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.tm{gap:4px 6px}.sec .sb{font-size:12px}

/* === logo, avatar, skin GTA SA, statistik === */
.tav{width:26px;height:26px;border-radius:7px;overflow:hidden}
.tav img{width:100%;height:100%;object-fit:contain;display:block}

.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.av.xs{width:24px;height:24px;font-size:11px}
.skin{display:block;object-fit:contain;flex:none}

/* === animasi halus naik-turun === */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes dn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes sh{from{transform:translateY(100%)}to{transform:none}}
@keyframes fo{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shine{to{background-position:-200% 0}}
.ov{animation:fo .25s}.md{animation:sh .42s cubic-bezier(.22,1,.36,1)}
@media(min-width:600px){.md{animation-name:up}}
.menu:not(.hide),nav.drawer:not(.hide){animation:dn .32s cubic-bezier(.22,1,.36,1)}
.mc,.tp,.card,.tr{transition:border-color .3s,box-shadow .3s,opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.rv{opacity:0;transform:translateY(22px)}.rv.in{opacity:1;transform:none}
.mc:hover,.tp:hover,.tr:hover{border-color:#c8f54255;box-shadow:0 10px 26px #000a}
.btn,.bt,.pill{transition:transform .2s,filter .2s}.btn:hover,.bt:hover{filter:brightness(1.1)}.btn:active,.bt:active,.pill:active{transform:scale(.95)}
.bar{background:linear-gradient(90deg,var(--ac) 30%,#fff 50%,var(--ac) 70%);background-size:200% 100%;animation:shine 3.5s linear infinite}
#fab{position:fixed;right:16px;bottom:18px;z-index:7;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);font-size:22px;cursor:pointer;box-shadow:0 8px 24px #c8f54233,0 6px 20px #000a;animation:bob 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* === chat === */
a[data-a]{cursor:pointer;color:inherit;text-decoration:none;font-weight:700}
.cw{display:flex;flex-direction:column;height:calc(100dvh - 250px);min-height:340px}.cw select{margin-bottom:10px}
.ms{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--ln);border-radius:16px;background:linear-gradient(#0c0c0c,#070707)}

/* === tema iOS dark berkilau === */

p+p{margin-top:.8em}b,strong{font-weight:700;color:#fff}.mu{line-height:1.5;color:#9a9aa6}

.card,.mc,.tp,.ds,.tr:not(.th),.ms,.pcs{background:linear-gradient(180deg,#16161b,#09090c);border:1px solid #ffffff14;border-radius:16px;box-shadow:inset 0 1px 0 #ffffff1f,0 10px 28px #000b}
.mc.dn{border-color:#c8f54233}.tr.f{background:linear-gradient(180deg,#1a2108,#0b0e04);border-color:#c8f54255}
.btn:not(.s):not(.d),.pill,.bt.lime{background:linear-gradient(180deg,#e4ff80,#c8f542 55%,#a8d61e);box-shadow:inset 0 1px 0 #fffa,0 6px 18px #c8f54230}
.btn.s,.bt{background:linear-gradient(180deg,#1d1d23,#111115);border:1px solid #ffffff1a;box-shadow:inset 0 1px 0 #ffffff18}
input,select,textarea{font-size:16px;background:#0b0b0f;border:1px solid #ffffff1a;border-radius:13px}
input:focus,select:focus,textarea:focus{border-color:#c8f54299;box-shadow:0 0 0 3px #c8f54218;outline:0}
.md{background:linear-gradient(180deg,#141418,#08080b);border:1px solid #ffffff1c;box-shadow:inset 0 1px 0 #ffffff22}
.dbot{background:linear-gradient(#101014,#050507);color:#f2f2f7;border-top:1px solid #ffffff22}
.dbot .card{background:linear-gradient(180deg,#16161b,#09090c);border-color:#ffffff14;color:#f2f2f7}.dbot .mu,.dbot .st span,.dbot .row .mu{color:#9a9aa6}
.dbot .st b,.dbot .row b{color:#fff}.dbot .tag{background:#1c1c22;color:#aaa}.dbot .btn.s{background:#1a1a20;color:#fff;border-color:#ffffff1a}.dbot .news p{color:#cfcfd8}.dbot [style*="var(--ac)"]{color:var(--ac)!important}
.news p{color:#d4d4dd;line-height:1.7}
.an{margin:0 0 14px;padding:11px 14px;border-radius:14px;background:linear-gradient(135deg,#1c1c22,#0c0c10);border:1px solid #c8f54233;box-shadow:inset 0 1px 0 #ffffff1a;font-size:14px;animation:dn .6s both}
/* === asisten AI === */
.bb.ai{max-width:100%;align-self:stretch;background:none;border:0;box-shadow:none;padding:2px 4px;font-size:15.5px;line-height:1.7;color:#e6e6ee}
.bb.ai ul{padding-left:20px;margin:6px 0}.bb.ai li{margin:4px 0}.bb.ai p+p{margin-top:.7em}
.td i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#aaa;margin:0 2px;animation:bob 1s ease-in-out infinite}.td i:nth-child(2){animation-delay:.15s}.td i:nth-child(3){animation-delay:.3s}
.gr2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

/* === dock navigasi bawah & ikon === */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.ic.ok{color:var(--ac)}.ic.wr{color:#ff8a8a}
@keyframes dk{from{opacity:0;transform:translate(-50%,44px)}to{opacity:1;transform:translate(-50%,0)}}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:400px;height:64px;z-index:9;display:flex;align-items:center;justify-content:space-around;padding:0 10px;border-radius:28px;background:linear-gradient(180deg,#1c1c22d9,#09090cdd);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid #ffffff1f;box-shadow:inset 0 1px 0 #ffffff2e,0 14px 40px #000d;animation:dk .65s cubic-bezier(.22,1,.36,1) both}
#dock button{width:56px;height:46px;border:0;background:none;color:#8e8e98;border-radius:18px;display:grid;place-items:center;cursor:pointer;transition:color .25s,background .25s,transform .3s cubic-bezier(.22,1,.36,1)}
#dock .ic{width:25px;height:25px}
#dock button.on{color:var(--ac);background:linear-gradient(180deg,#ffffff1f,#ffffff08);box-shadow:inset 0 1px 0 #ffffff26;transform:translateY(-3px)}
#dock button:active{transform:scale(.88)}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,me=localStorage.getItem('sea2_me'),view='home';
const seed=()=>({users:[{u:'owner',pw:'owner123',ign:'Owner',wa:'',dc:'',bio:'Penyelenggara SLS',team:0,role:'Pemain',owner:1}],teams:[],
 news:[{id:1,t:'Pendaftaran SEA Devisi 2 dibuka',b:'Daftarkan tim kamu sekarang. Satu tim maksimal 5 pemain inti dan 2 cadangan.',d:new Date().toISOString()}],notifs:[],nid:2,tid:1});
/* ---------- Supabase sync ---------- */
const SB_URL='https://kyxunshyztmprhdofzvp.supabase.co',SB_KEY='sb_publishable_CivGpqZcCATZtyUiNBqzsQ_hcmoiay8';
const SBH={apikey:SB_KEY,'Content-Type':'application/json'};
let synced=false,pending=0,last='';
const norm=()=>{db.users=db.users||[];db.teams=db.teams||[];db.news=db.news||[];db.notifs=db.notifs||[];db.matches=db.matches||[];db.mid=db.mid||1;db.nid=db.nid||2;db.tid=db.tid||1;db.chats=db.chats||{};db.sv=db.sv||{};db.cfg=Object.assign({ann:'',reg:1,ai:1,gc:1,ext:1},db.cfg||{});const o=db.users.find(x=>x.owner);if(o&&!o.code)o.code='SLS2026'};
async function pull(){const r=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data',{headers:SBH,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json();if(j[0]&&j[0].data&&j[0].data.users){db=j[0].data;norm();synced=true;last=JSON.stringify(db);return}
 db=seed();norm();synced=true;await push()}
async function push(){if(!synced)return toast('Belum tersambung ke server');pending++;
 try{const r=await fetch(SB_URL+'/rest/v1/app_state',{method:'POST',headers:{...SBH,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:db})});
  if(!r.ok)throw new Error('HTTP '+r.status);last=JSON.stringify(db)}catch(e){toast('Gagal simpan: '+e.message)}finally{pending--}}
const save=()=>{push()};
async function refresh(){if(pending||!synced||view==='chat')return;if(document.querySelector('.ov')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
 try{const before=last;await pull();if(last!==before)render()}catch(e){}}
const U=n=>db.users.find(x=>x.u.toLowerCase()===String(n||'').toLowerCase()),cur=()=>U(me),own=()=>cur()?.owner;
const T=id=>db.teams.find(t=>t.id==id),members=id=>db.users.filter(u=>u.team==id);
const fmt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}

function modal(title,html,onSave,label='Simpan'){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><div class="row"><h2>${esc(title)}</h2><button class="ib" data-x>✕</button></div>${html}<div class="msg" data-m></div>${onSave?`<button class="btn w" data-ok style="margin-top:10px">${label}</button>`:''}</div>`;
 document.body.append(o);const close=()=>o.remove();
 o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)close()};
 if(onSave)o.querySelector('[data-ok]').onclick=()=>{const v={};o.querySelectorAll('[name]').forEach(i=>v[i.name]=i.value);
  const r=onSave(v);if(r)o.querySelector('[data-m]').textContent=r;else{close();render()}};return o}
const f=(n,l,v='',t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}>`;
const sel=(n,l,opts,v)=>`<label>${l}</label><select name="${n}">${opts.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
const teamOpts=(none)=>[...(none?[[0,'Tanpa tim']]:[]),...db.teams.map(t=>[t.id,`${t.name} [${t.abbr}] (${members(t.id).length}/7)`])];

function addTeam(name,abbr){name=name.trim();abbr=abbr.trim().toUpperCase();
 if(name.length<2)return'Isi nama tim';if(!/^[A-Z0-9]{1,5}$/.test(abbr))return'Singkatan maks 5 huruf/angka';
 if(db.teams.some(t=>t.name.toLowerCase()==name.toLowerCase()||t.abbr==abbr))return'Nama atau singkatan sudah dipakai';
 const t={id:db.tid++,name,abbr};db.teams.push(t);return t}
function setRole(u,role){if(role==='Kapten')members(u.team).forEach(m=>{if(m!==u&&m.role==='Kapten')m.role='Pemain'});u.role=role}

const tn=id=>T(id)?.name||'?',srt=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);

const shrink=(file,sz,sq)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
 const c=document.createElement('canvas'),x=c.getContext('2d');
 if(sq){const m=Math.min(im.width,im.height),o=Math.min(sz,m);c.width=c.height=o;x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,o,o)}
 else{const k=Math.min(sz/im.width,sz/im.height,1),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));c.width=w;c.height=h;x.drawImage(im,0,0,w,h)}
 let u=c.toDataURL('image/webp',.82);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');ok(u)};im.src=r.result};r.readAsDataURL(file)});

  if(!confirm('Pulihkan data dari file ini? Data sekarang ('+db.users.length+' user, '+db.teams.length+' tim, '+db.matches.length+' jadwal) akan DIGANTI.'))return;

V.news=()=>{let h=`<div class="row"><h2>Berita</h2>${own()?'<span><button class="btn s" data-a="studioOpen" data-t="back">+ Poster</button> <button class="btn s" data-a="newsAdd">+ Teks</button></span>':''}</div>`;
 return h+[...db.news].reverse().map(n=>`<article class="card news">${n.img?`<img class="nim" src="${n.img}" data-a="newsImg" data-id="${n.id}" alt="">`:''}<div class="row"><h3>${esc(n.t)}</h3>${own()?`<span><button class="btn s" data-a="newsEdit" data-id="${n.id}">Ubah</button> <button class="btn d s" data-a="newsDel" data-id="${n.id}">Hapus</button></span>`:''}</div><div class="mu" style="margin-bottom:8px">${fmt(n.d)}</div>${n.b?`<p>${esc(n.b)}</p>`:''}</article>`).join('')};
</script></body></html>
