<html lang="id"><head><meta charset="utf-8">

<title>SEA DEVISI 2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--c:#13131b;--c2:#1b1b26;--ln:#272734;--tx:#ececf4;--mu:#8c8ca0;--ac:#7c6cf0;--ac2:#4f3fc4;--er:#ff6b6b;--ok:#5fe3a1;--gd:#f5c451}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:50px}
header{position:sticky;top:0;z-index:5;background:#0a0a0fee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:12px 14px}
.logo{font-weight:800;font-size:18px;flex:1;letter-spacing:.2px}.logo b{color:var(--ac)}
.ib{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--c);color:var(--tx);font-size:18px;cursor:pointer}
.ib:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.dot{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;font-weight:700}
nav{display:flex;gap:6px;padding:12px 14px;overflow-x:auto}
nav button{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--ln);background:none;color:var(--mu);font:600 14px inherit;font-family:inherit;cursor:pointer}
nav .on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:640px;margin:0 auto;padding:0 14px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:20px;margin-bottom:12px}h3{font-size:16px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.pl:first-of-type{border-top:0}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;flex:none}
.av.big{width:72px;height:72px;font-size:28px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--c2);color:var(--mu)}.tag.cap{background:#3a2f0b;color:var(--gd)}
.btn{padding:11px 16px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:700 14px inherit;font-family:inherit;cursor:pointer}
.btn.s{padding:7px 12px;font-size:13px;background:var(--c2);color:var(--tx);border:1px solid var(--ln)}.btn.d{background:none;color:var(--er);border:1px solid #4a2326}
.btn.w{width:100%}label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:#07070b;color:var(--tx);font:15px inherit;font-family:inherit}
textarea{min-height:80px;resize:vertical}.msg{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
.menu{position:fixed;top:58px;right:12px;z-index:9;background:var(--c2);border:1px solid var(--ln);border-radius:14px;min-width:190px;padding:6px;box-shadow:0 12px 30px #0009}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;color:var(--tx);font:14px inherit;font-family:inherit;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--c)}.hide{display:none!important}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--c);border:1px solid var(--ln);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:20px}}
.news h3{margin-bottom:4px}.news p{color:#c9c9d8;white-space:pre-wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30}
.nt{padding:10px 0;border-top:1px solid var(--ln)}.nt.new{border-left:3px solid var(--ac);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st{text-align:center;padding:12px;margin:0}.st b{display:block;font-size:22px}
.tag.w{background:#0f3a25;color:var(--ok)}.tag.l{background:#3a1215;color:var(--er)}

:root{--bg:#000;--c:#0a0a0a;--c2:#141414;--ln:#1f1f1f;--ac:#c8f542;--ac2:#9fcb24;--mu:#8a8a8a;--gd:#c8f542}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{background:#000d;justify-content:space-between}.logo{flex:none;white-space:nowrap;font-size:14px;font-weight:900;letter-spacing:.3px}.logo b{display:inline}.logo b{color:var(--ac)}
.rt{flex:1;display:flex;justify-content:flex-end;gap:8px;align-items:center}.ib.wide{width:52px;border-radius:99px;margin:0 6px}
.pill{background:var(--ac);color:#0a0a0a;border:0;border-radius:99px;padding:9px 10px;font:800 11px inherit;font-family:inherit;cursor:pointer}
.btn{color:#0a0a0a;border-radius:10px}.av{color:#0a0a0a;background:var(--ac)}.card{border-radius:12px}
.tag.w{background:var(--ac);color:#0a0a0a;font-weight:800}.tag.l{background:#2a1010;color:var(--er);font-weight:800}
nav.drawer{position:fixed;top:59px;left:0;right:0;z-index:8;flex-direction:column;gap:0;background:#050505;border-bottom:1px solid var(--ln);padding:6px 14px}
.drawer button{text-align:left;border:0;border-bottom:1px solid var(--ln);border-radius:0;padding:15px 4px;font-size:15px;color:var(--tx);background:none}
.drawer button.on{background:none;color:var(--ac)}
.hero{padding:6px 0 22px}.wm{width:100%;max-width:300px;display:block;margin:0 0 16px}
.hero h1{font-size:30px;line-height:1.15;font-weight:800}.hero em,.lt em{color:var(--ac);font-style:normal}
.hero p{color:var(--mu);margin:10px 0 16px}.hero .hb{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px}
.lt{font-size:24px;font-weight:900}
.tr{display:grid;grid-template-columns:28px 1fr 52px 46px 46px;align-items:center;padding:12px 10px;border:1px solid var(--ln);border-radius:10px;margin-bottom:6px;background:var(--c);font-size:14px}
.tr.th{background:none;border:0;color:var(--mu);font-size:12px}.tr.f{border-color:var(--ac)}.tr.f span:first-child{color:var(--ac)}

body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:46vh;background:radial-gradient(ellipse at 50% 100%,#33333399,transparent 70%);z-index:-1;pointer-events:none}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:60px;background:transparent;border:0;padding:10px 14px;backdrop-filter:none}
.lg{display:flex;flex-direction:column;line-height:1;cursor:pointer;color:#fff;flex:1}.lg i{font:italic 900 19px Inter,sans-serif;letter-spacing:-.5px}.lg small{font:700 6.5px Inter,sans-serif;letter-spacing:1.6px;margin-top:3px;color:#ddd}
.hbx{width:48px;height:40px;border-radius:10px;border:1px solid #2e2e2e;background:#0b0b0b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}.hbx span{width:22px;height:2px;background:#fff;border-radius:2px}
.pill{display:flex;align-items:center;gap:6px;padding:9px 12px;font:800 11px Inter,sans-serif;letter-spacing:.5px}
main{max-width:640px;padding:62px 20px 40px}
.hero{min-height:calc(100vh - 62px);padding:16vh 10px 100px;position:relative;margin:0}
.hero h1{font-size:17px;font-weight:600;line-height:1.5;letter-spacing:.2px}
.hero p{color:#8a8a8a;font-size:13px;line-height:1.5;margin:14px 0 22px;max-width:340px}
.hero .hb{display:grid;width:max-content;gap:8px;margin:0}
.bt{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;border:1px solid #2a2a2a;background:#121212;color:#fff;font:700 12px Inter,sans-serif;letter-spacing:.8px;cursor:pointer}
.bt.lime{background:var(--ac);color:#0a0a0a;border-color:var(--ac)}
.scr{position:absolute;left:10px;bottom:34px;color:#777;font-size:11px;letter-spacing:2px;display:flex;flex-direction:column;gap:6px}
.sec{padding:70px 0 10px}.sec .lt{font-size:27px;font-weight:800;letter-spacing:-.3px}.sb{color:#7a7a7a;font-size:13px;margin:4px 0 12px}
.bar{display:block;width:70px;height:3px;background:var(--ac);border-radius:3px;margin-bottom:34px}
.sec .tr{grid-template-columns:50px 1fr 42px 56px 42px;padding:11px 8px;font-size:13px;margin-bottom:8px;background:#0a0a0a;border-color:#1a1a1a}
.sec .tr.th{background:none;border:0;font-size:11px;letter-spacing:.8px;padding:0 8px 4px}.sec .tr span:nth-child(n+3){text-align:center}
.tn{display:flex;align-items:center;gap:8px}.tn b{font-weight:700}
.tr.f{background:#0e1405;border-color:#b9e23a88}.r0{color:var(--ac);font-weight:800}.r1{color:#aaa}.r2{color:#d58a3a}.r3{color:#777}
.tr .pt{color:var(--ac);font-weight:800}.tr .mu2{color:#888}
.tav{width:22px;height:22px;border-radius:6px;border:1px solid #333;background:#161616;display:inline-grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.fl{display:flex;justify-content:center;margin:40px 0 24px}.fl label{display:flex;align-items:center;gap:8px;border:1px solid #2a2a2a;background:#0b0b0b;border-radius:10px;padding:2px 8px;margin:0}
.fl select{width:auto;border:0;background:none;color:var(--ac);font-weight:700;padding:10px 6px}.oi{width:14px;height:14px;border-radius:4px;background:#f08a24;display:inline-block}
.mc{border:1px solid #1c1c1c;background:linear-gradient(#0c0c0c,#080808);border-radius:14px;padding:12px 14px;margin-bottom:12px}.mc.dn{border-color:#2d3a12;background:linear-gradient(#0e1405,#080a04)}
.ix{color:#666;font-size:11px}.dt{color:var(--ac);font-weight:700;font-size:15px;margin-top:2px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);vertical-align:middle}.dl{color:#777;font-size:11px;margin-bottom:8px}
.tm{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}.tm b{font-weight:700}.vs{color:#666;font-size:11px}
.wl{font-size:11px;font-weight:800;border-radius:5px;padding:1px 7px}.wl.w{background:var(--ac);color:#0a0a0a}.wl.l{background:#1c1c1c;color:#999}.wl.d{background:#262626;color:#ccc}
.sc{font-size:17px;font-weight:800;margin:0 4px}.sc u{color:#777;text-decoration:none;font-weight:400}
.fn{font-weight:800;font-size:16px;margin-top:8px}.fn sup{color:#777;font-size:8px;font-weight:600;margin-left:2px}
.ls{background:none;border:0;color:#fff;font:600 16px Inter,sans-serif;margin-top:6px;padding:0;cursor:pointer}
#sp{position:fixed;inset:0;background:#000;z-index:100;transition:opacity .6s}#sp img{display:block;width:78%;max-width:340px;margin:17vh auto 0;opacity:0;animation:fi 1.4s .2s forwards}
#sp .tx{position:absolute;left:30px;top:56vh;font:600 17px/1.5 Inter,sans-serif;white-space:pre;text-transform:uppercase}#sp em,.hero em{color:var(--ac);font-style:normal}
@keyframes fi{to{opacity:1}}
.g{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.tm{gap:4px 6px}.sec .sb{font-size:12px}
.dtop{margin:0 -20px;padding:30px 20px 34px}.dh{color:#8a8a8a;font-size:13px}.dt1{font-size:30px;font-weight:900;margin:2px 0 18px}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ds{background:#111;border:1px solid #232323;border-radius:12px;padding:14px 8px;text-align:center}.ds b{display:block;font-size:24px;color:var(--ac)}.ds span{color:#8a8a8a;font-size:12px}
.dbot{margin:0 -20px -90px;padding:26px 20px 120px;background:#f5f5f7;color:#111;border-radius:22px 22px 0 0;min-height:60vh}
.dbot h3{margin:16px 0 10px;font-size:16px}.dbot h3:first-child{margin-top:0}
.dbot .card{background:#fff;border:1px solid #e6e6ea;color:#111}.dbot .mu,.dbot .st span,.dbot .row .mu{color:#6b6b75}.dbot .st b{color:#111}
.dbot .tag{background:#ececf0;color:#555}.dbot .tag.w{background:var(--ac);color:#0a0a0a}.dbot .tag.l{background:#fde4e4;color:#c0392b}
.dbot .btn.s{background:#fff;color:#111;border-color:#dcdce2}.dbot .btn.d{border-color:#f3c4c4}
.dbot .news p{color:#444}.dbot [style*="var(--ac)"]{color:#4a6a00!important}.dbot .row b{color:#111}

/* === logo, avatar, skin GTA SA, statistik === */
.tav{width:26px;height:26px;border-radius:7px;overflow:hidden}
.tav img{width:100%;height:100%;object-fit:contain;display:block}
.th3{display:flex;align-items:center;gap:8px}.th3 .tav{width:32px;height:32px;border-radius:8px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.av.xs{width:24px;height:24px;font-size:11px}

.skin.ph{display:grid;place-items:center;background:#111;border:1px dashed #2f2f2f;border-radius:8px;color:#777;font:800 12px Inter,sans-serif}
.imf{display:flex;align-items:center;gap:12px}.imp{width:64px;height:64px;border-radius:12px;border:1px solid var(--ln);background:#07070b;display:grid;place-items:center;overflow:hidden;flex:none}

.skb small{font-size:11px}.skb:active{border-color:var(--ac)}

.tbw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.stt{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;min-width:560px}
.stt th{color:var(--mu);font-size:11px;letter-spacing:.8px;font-weight:600;text-align:center;padding:0 6px 2px;white-space:nowrap}
.stt th.l{text-align:left}.stt td{padding:8px 6px;text-align:center;background:var(--c2);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}

.phd{display:flex;gap:16px;align-items:center;margin-bottom:12px}.phr{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.sg3{margin-bottom:12px}.sg3 .st b{color:var(--ac)}
.tp{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #1a1a1a;background:#0a0a0a;border-radius:12px;margin-bottom:8px;cursor:pointer}
.tp>span:first-child{width:22px;font-weight:800;text-align:center}.tpn{flex:1;min-width:0}.tpn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tpn .mu{font-size:11px}
.tps{text-align:center;min-width:34px}.tp .btn.s{padding:6px 8px;font-size:11px}.tp{flex-wrap:wrap}.tp .tpn{min-width:90px}.tps b{display:block;font-size:16px;color:var(--ac)}.tps span{font-size:9px;color:#777;letter-spacing:.8px}

async function pull(){const r=await fetch(SB_URL+'/rest/v1/app_state?id=eq.1&select=data',{headers:SBH,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json();if(j[0]&&j[0].data&&j[0].data.users){db=j[0].data;norm();synced=true;last=JSON.stringify(db);return}
 db=seed();norm();synced=true;await push()}
async function push(){if(!synced)return toast('Belum tersambung ke server');pending++;
 try{const r=await fetch(SB_URL+'/rest/v1/app_state',{method:'POST',headers:{...SBH,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:db})});
  if(!r.ok)throw new Error('HTTP '+r.status);last=JSON.stringify(db)}catch(e){toast('Gagal simpan: '+e.message)}finally{pending--}}
const save=()=>{push()};
async function refresh(){if(pending||!synced)return;if(document.querySelector('.ov')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
 try{const before=last;await pull();if(last!==before)render()}catch(e){}}
const U=n=>db.users.find(x=>x.u.toLowerCase()===String(n||'').toLowerCase()),cur=()=>U(me),own=()=>cur()?.owner;
const T=id=>db.teams.find(t=>t.id==id),members=id=>db.users.filter(u=>u.team==id);
const fmt=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}

function modal(title,html,onSave,label='Simpan'){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><div class="row"><h2>${esc(title)}</h2><button class="ib" data-x>✕</button></div>${html}<div class="msg" data-m></div>${onSave?`<button class="btn w" data-ok style="margin-top:10px">${label}</button>`:''}</div>`;
 document.body.append(o);const close=()=>o.remove();
 o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)close()};
 if(onSave)o.querySelector('[data-ok]').onclick=()=>{const v={};o.querySelectorAll('[name]').forEach(i=>v[i.name]=i.value);
  const r=onSave(v);if(r)o.querySelector('[data-m]').textContent=r;else{close();render()}};return o}
const f=(n,l,v='',t='text',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}>`;
const sel=(n,l,opts,v)=>`<label>${l}</label><select name="${n}">${opts.map(([a,b])=>`<option value="${esc(a)}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
const teamOpts=(none)=>[...(none?[[0,'Tanpa tim']]:[]),...db.teams.map(t=>[t.id,`${t.name} [${t.abbr}] (${members(t.id).length}/7)`])];

function addTeam(name,abbr){name=name.trim();abbr=abbr.trim().toUpperCase();
 if(name.length<2)return'Isi nama tim';if(!/^[A-Z0-9]{1,5}$/.test(abbr))return'Singkatan maks 5 huruf/angka';
 if(db.teams.some(t=>t.name.toLowerCase()==name.toLowerCase()||t.abbr==abbr))return'Nama atau singkatan sudah dipakai';
 const t={id:db.tid++,name,abbr};db.teams.push(t);return t}
function setRole(u,role){if(role==='Kapten')members(u.team).forEach(m=>{if(m!==u&&m.role==='Kapten')m.role='Pemain'});u.role=role}

const tn=id=>T(id)?.name||'?',srt=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const rec=id=>{let w=0,l=0,d=0;db.matches.filter(m=>m.done&&(m.a==id||m.b==id)).forEach(m=>{const s=m.a==id?[m.sa,m.sb]:[m.sb,m.sa];s[0]>s[1]?w++:s[0]<s[1]?l++:d++});return{w,l,d}};
const res=(m,id)=>{if(!m.done)return'';const s=m.a==id?[m.sa,m.sb]:[m.sb,m.sa];return s[0]>s[1]?'<span class="tag w">W</span>':s[0]<s[1]?'<span class="tag l">L</span>':'<span class="tag">Seri</span>'};
const mRow=(m,id)=>`<div class="card"><div class="row"><div><b>${esc(tn(m.a))}</b> <span class="mu">vs</span> <b>${esc(tn(m.b))}</b><div class="mu" style="color:var(--ac);font-weight:600">${fmt(m.date)}${m.time?' · '+esc(m.time):''}</div></div><div style="text-align:right">${m.done?`<b style="font-size:18px">${m.sa} - ${m.sb}</b><div>${id?res(m,id):''}</div><button class="btn s" style="margin-top:6px" data-a="stats" data-id="${m.id}">Stats</button>`:'<span class="tag">Belum main</span>'}${own()?`<div style="margin-top:6px"><button class="btn s" data-a="mStats" data-id="${m.id}">Stats</button> <button class="btn s" data-a="mEdit" data-id="${m.id}">Atur</button> <button class="btn d s" data-a="mDel" data-id="${m.id}">Hapus</button></div>`:''}</div></div></div>`;
const mList=(ms,id)=>{const up=ms.filter(m=>!m.done).sort(srt),dn=ms.filter(m=>m.done).sort(srt).reverse();return`${up.length?'<h3 style="margin:6px 0 8px">Akan datang</h3>'+up.map(m=>mRow(m,id)).join(''):''}${dn.length?'<h3 style="margin:14px 0 8px">Hasil</h3>'+dn.map(m=>mRow(m,id)).join(''):''}${ms.length?'':'<div class="card mu">Belum ada jadwal pertandingan.</div>'}`};
const recCard=id=>{const r=rec(id);return`<div class="grid"><div class="card st"><b>${r.w}</b><span class="mu">Menang</span></div><div class="card st"><b>${r.l}</b><span class="mu">Kalah</span></div><div class="card st"><b>${r.d}</b><span class="mu">Seri</span></div></div>`};
const mForm=m=>sel('a','Tim A',teamOpts(),m.a)+sel('b','Tim B',teamOpts(),m.b)+f('date','Tanggal',m.date||'','date')+f('time','Jam',m.time||'','time')+(m.id?f('sa','Skor tim A',m.sa??0,'number','min="0"')+f('sb','Skor tim B',m.sb??0,'number','min="0"')+sel('done','Status',[[0,'Belum main'],[1,'Selesai']],m.done?1:0):'');
const mSave=(m,v)=>{if(v.a==v.b)return'Pilih dua tim yang berbeda';if(!v.date)return'Tanggal wajib diisi';
 Object.assign(m,{a:+v.a,b:+v.b,date:v.date,time:v.time});if(m.id){m.sa=+v.sa||0;m.sb=+v.sb||0;m.done=+v.done?1:0}else{m.id=db.mid++;m.done=0;m.sa=0;m.sb=0;db.matches.push(m)}save()};
const LOGO='<svg viewBox="0 0 300 110" class="wm" aria-hidden="true"><text x="150" y="92" text-anchor="middle" font-family="Inter,Arial Black,sans-serif" font-weight="900" font-size="112" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="1 5" stroke-linecap="round">SEA</text></svg>';
const hero=full=>`<section class="hero">${LOGO}<h1>THE NEW ERA OF <em>GTA</em><br>SA:MP<br>COMPETITION</h1>${full?`<p>SEA Devisi 2 menghadirkan kompetisi SA:MP yang profesional. ${db.teams.length} tim, ${db.matches.length} pertandingan. Satu juara.</p><div class="hb"><button class="btn" data-v="klasemen">🏆 STANDINGS</button><button class="btn s" data-v="jadwal">🎮 SCHEDULE</button></div>`:''}</section>`;

const SKIN_URL='https://assets.open.mp/assets/images/skins/'; /* ganti kalau mau pakai sumber gambar skin lain: SKIN_URL+ID+'.png' */
const SF=[['k','Kill'],['d','Death'],['a','Assist'],['sh','Shot'],['ht','Hit'],['hs','HS'],['dm','Dmg']];
const nsk=v=>v===''||v==null||isNaN(+v)?'':Math.max(0,Math.min(311,Math.floor(+v)));
const acc=(h,s)=>s>0?Math.round(h/s*1000)/10:0,kd=(k,d)=>d>0?Math.round(k/d*100)/100:k;
const skimg=(id,c='')=>id===''||id==null||isNaN(+id)?`<span class="skin ph ${c}">?</span>`:`<img class="skin ${c}" src="${SKIN_URL}${+id}.png" alt="Skin ${+id}" loading="lazy" onerror="this.outerHTML='<span class=&quot;skin ph ${c}&quot;>${+id}</span>'">`;
const skt=p=>p.skin===''||p.skin==null?'':skimg(p.skin,'sm');
const avh=(p,c='')=>`<div class="av ${c}">${p.av?`<img src="${esc(p.av)}" alt="">`:esc((p.ign||p.u||'?')[0]).toUpperCase()}</div>`;
const imgField=(n,l,v,sz,sq)=>`<label>${l}</label><div class="imf" data-sz="${sz}" data-sq="${sq?1:0}"><span class="imp">${v?`<img src="${esc(v)}" alt="">`:'<i>Belum ada</i>'}</span><div class="imb"><label class="btn s up">Pilih gambar<input type="file" accept="image/*" data-img hidden></label><button type="button" class="btn d s" data-clr>Hapus</button></div><input type="hidden" name="${n}" value="${esc(v||'')}"></div>`;
const skinField=v=>`<label>Karakter GTA San Andreas (Skin ID 0-311)</label><div class="skf"><span class="skp">${v===''||v==null?'<i>?</i>':skimg(v,'md')}</span><input name="skin" type="number" min="0" max="311" placeholder="ID skin" value="${esc(v??'')}"><button type="button" class="btn s" data-skpick>Pilih</button></div>`;
const skSet=(box,v)=>{const i=box.querySelector('input[name=skin]');if(String(i.value)!==String(v))i.value=v;box.querySelector('.skp').innerHTML=(v===''||isNaN(+v)||+v<0||+v>311)?'<i>?</i>':skimg(+v,'md')};
const shrink=(file,sz,sq)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
 const c=document.createElement('canvas'),x=c.getContext('2d');
 if(sq){const m=Math.min(im.width,im.height),o=Math.min(sz,m);c.width=c.height=o;x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,o,o)}
 else{const k=Math.min(sz/im.width,sz/im.height,1),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));c.width=w;c.height=h;x.drawImage(im,0,0,w,h)}
 let u=c.toDataURL('image/webp',.82);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');ok(u)};im.src=r.result};r.readAsDataURL(file)});
document.addEventListener('change',e=>{const r=e.target.closest('[data-rst]');if(!r||!r.files[0]||!own())return;const fl=r.files[0];r.value='';
 fl.text().then(t=>{const d=JSON.parse(t);if(!d||!Array.isArray(d.users)||!d.users.some(x=>x.owner))throw 0;
  if(!confirm('Pulihkan data dari file ini? Data sekarang ('+db.users.length+' user, '+db.teams.length+' tim, '+db.matches.length+' jadwal) akan DIGANTI.'))return;
  db=d;norm();save();render();toast('Data dipulihkan')}).catch(()=>toast('File backup tidak valid'))});
document.addEventListener('change',async e=>{const i=e.target.closest('[data-img]');if(!i||!i.files[0])return;const b=i.closest('.imf');
 try{const u=await shrink(i.files[0],+b.dataset.sz||128,b.dataset.sq==='1');b.querySelector('input[type=hidden]').value=u;b.querySelector('.imp').innerHTML=`<img src="${u}" alt="">`}catch(x){toast('Gambar tidak bisa dibaca')}i.value=''});
document.addEventListener('click',e=>{const c=e.target.closest('[data-clr]');if(c){const b=c.closest('.imf');b.querySelector('input[type=hidden]').value='';b.querySelector('.imp').innerHTML='<i>Belum ada</i>';return}
 const k=e.target.closest('[data-skpick]');if(k){const box=k.closest('.skf');pickSkin(id=>skSet(box,id))}});
document.addEventListener('input',e=>{const i=e.target.closest('.skf input[name=skin]');if(i)skSet(i.closest('.skf'),i.value)});
function pickSkin(cb){const o=document.createElement('div');o.className='ov';o.style.zIndex=25;
 o.innerHTML=`<div class="md" role="dialog" aria-label="Pilih karakter"><div class="row"><h2>Pilih karakter</h2><button class="ib" data-x>✕</button></div><input type="number" min="0" max="311" placeholder="Cari ID skin (0-311)" data-sks><div class="skg">${Array.from({length:312},(_,i)=>`<button type="button" class="skb" data-id="${i}">${skimg(i,'sm')}<small>${i}</small></button>`).join('')}</div></div>`;
 document.body.append(o);
 o.onclick=e=>{const b=e.target.closest('.skb');if(b){cb(+b.dataset.id);o.remove();return}if(e.target===o||e.target.dataset.x!==undefined)o.remove()};
 o.querySelector('[data-sks]').oninput=e=>{const q=e.target.value.trim();o.querySelectorAll('.skb').forEach(b=>b.classList.toggle('hide',q!==''&&!b.dataset.id.startsWith(q)))}}
const pstat=u=>{const r={m:0,k:0,d:0,a:0,sh:0,ht:0,hs:0,dm:0};db.matches.forEach(m=>{if(!m.done)return;(m.ps||[]).forEach(x=>{if(x.u!==u)return;r.m++;SF.forEach(([k])=>r[k]+=x[k]||0)})});r.acc=acc(r.ht,r.sh);r.kd=kd(r.k,r.d);return r};
const statGrid=s=>{const c=(v,l)=>`<div class="card st"><b>${v}</b><span class="mu">${l}</span></div>`;return`<div class="grid sg3">${c(s.k,'Kill')}${c(s.d,'Death')}${c(s.a,'Assist')}${c(s.sh,'Shot')}${c(s.ht,'Hit')}${c(s.acc+'%','Accuracy')}${c(s.hs,'Headshot')}${c(s.dm,'Damage')}${c(s.kd,'K/D')}</div>`};

const stTable=(rows,top)=>`<div class="tbw"><table class="stt"><thead><tr><th class="l">PEMAIN</th>${['K','D','A','SHOT','HIT','ACC','HS','DMG'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>{const p=U(x.u),sk=x.sk===''||x.sk==null?p?.skin:x.sk;
 return`<tr data-a="pcard" data-u="${esc(x.u)}"><td class="pn"><div class="pw">${skimg(sk,'sm')}${p?avh(p,'xs'):''}<span>${esc(p?.ign||x.n||x.u)}${x===top?' <span class="tag cap">MVP</span>':''}</span></div></td><td class="ac">${x.k}</td><td>${x.d}</td><td>${x.a}</td><td>${x.sh}</td><td>${x.ht}</td><td>${acc(x.ht,x.sh)}%</td><td>${x.hs}</td><td>${x.dm}</td></tr>`}).join('')}</tbody></table></div>`;
const rank=()=>db.users.filter(u=>!u.owner).map(u=>({u,s:pstat(u.u)})).sort((a,b)=>b.s.k-a.s.k||b.s.a-a.s.a||a.s.d-b.s.d);
